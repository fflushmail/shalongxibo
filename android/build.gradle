// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// ── Java & Kotlin 17 compatibility override ────────────────────────────────────
// Capacitor 7 targets Java 21; force Java & Kotlin 17 on every subproject so the build
// works with JDK 17.
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android.compileOptions.sourceCompatibility = JavaVersion.VERSION_17
            project.android.compileOptions.targetCompatibility = JavaVersion.VERSION_17
        }
        project.tasks.matching { it.name.contains("Kotlin") }.configureEach {
            try {
                it.kotlinOptions {
                    jvmTarget = "17"
                }
            } catch (Exception ignored) {}
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
